[theme]
base = "light"
primaryColor = "#b64f36"
backgroundColor = "#f7f8f4"
secondaryBackgroundColor = "#e7eee9"
textColor = "#202d2a"
font = "sans serif"
headingFont = "sans serif"
headingFontSizes = ["2.25rem", "1.5rem", "1.25rem", "1rem", "0.875rem", "0.75rem"]
headingFontWeights = [700, 650, 600, 550, 500, 500]
baseRadius = "8px"
buttonRadius = "8px"
borderColor = "#d3ded7"
showWidgetBorder = true
showSidebarBorder = true
blueColor = "#326b7f"
greenColor = "#3e765b"
orangeColor = "#b65e39"

[theme.sidebar]
backgroundColor = "#edf1ec"
secondaryBackgroundColor = "#e7eee9"
textColor = "#202d2a"
borderColor = "#d3ded7"